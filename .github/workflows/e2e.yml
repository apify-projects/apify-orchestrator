name: E2E Tests

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run e2e tests
              run: node e2e-test.js
              env:
                  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
