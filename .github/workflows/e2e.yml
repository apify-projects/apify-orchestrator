name: E2E Tests

on:
    pull_request:

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run e2e tests
              run: node e2e-test.js
              env:
                  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
